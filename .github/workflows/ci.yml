name: ci

on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Tools
        uses: jdx/mise-action@v4
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Unit test
        run: pnpm test
      - name: Run Build
        run: pnpm build
